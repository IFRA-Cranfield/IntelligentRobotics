Specifications:
  Robot: "ur3"
  EndEffector: "RobotiqHandE/UR" # None if not required.
  EELink: "None" # None if not required.
  Objects: "None" # None if not required.

Sequence:

  - Step: 0
    Name: "Robot to Home Position."
    Type: "MoveJ"
    Speed: 1.0
    Delay: 0.0
    Input:
      joint1: -45.0
      joint2: -90.0
      joint3: -90.0
      joint4: -90.0
      joint5: 90.0
      joint6: 0.0

  - Step: 1
    Name: "Robot to Pick/Approach Position."
    Type: "RobMove"
    Movement: "PTP"
    Speed: 1.0
    Delay: 0.0
    Input:
      x: -0.25
      y: 0.6
      z: 0.85
      qx: 0.0
      qy: 1.0
      qz: 0.0
      qw: 0.0

  - Step: 2
    Name: "Robot to Pick Position."
    Type: "RobMove"
    Movement: "LIN"
    Speed: 0.1
    Delay: 0.5
    Input:
      x: -0.25
      y: 0.6
      z: 0.775
      qx: 0.0
      qy: 1.0
      qz: 0.0
      qw: 0.0

  - Step: 3
    Name: "CLOSE GRIPPER."
    Type: "RobotiqHandE/UR"
    Action: "CLOSE"
    Delay: 0.5

  - Step: 4
    Name: "Robot to Pick/Lift Position."
    Type: "MoveL"
    Speed: 0.1
    Delay: 0.0
    Input:
      x: 0.0
      y: 0.0
      z: 0.10

  - Step: 5
    Name: "Robot to Place/Approach Position."
    Type: "RobMove"
    Movement: "PTP"
    Speed: 1.0
    Delay: 0.0
    Input:
      x: -0.4
      y: 0.6
      z: 0.90
      qx: 0.707
      qy: 0.707
      qz: 0.0
      qw: 0.0

  - Step: 6
    Name: "Robot to Place Position."
    Type: "RobMove"
    Movement: "LIN"
    Speed: 0.1
    Delay: 0.5
    Input:
      x: -0.4
      y: 0.6
      z: 0.80
      qx: 0.707
      qy: 0.707
      qz: 0.0
      qw: 0.0

  - Step: 7
    Name: "OPEN GRIPPER."
    Type: "RobotiqHandE/UR"
    Action: "OPEN"
    Delay: 0.5

  - Step: 8
    Name: "Robot to Place/Lift Position."
    Type: "MoveL"
    Speed: 0.1
    Delay: 0.0
    Input:
      x: 0.0
      y: 0.0
      z: 0.10

  - Step: 9
    Name: "Robot to Home Position."
    Type: "MoveJ"
    Speed: 1.0
    Delay: 0.0
    Input:
      joint1: -45.0
      joint2: -90.0
      joint3: -90.0
      joint4: -90.0
      joint5: 90.0
      joint6: 0.0